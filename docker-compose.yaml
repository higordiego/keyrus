services:
  postgres:
    image: postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: ${CASHFLOW_DB_PASSWORD:-secret}
      POSTGRES_DB: cashflow
    ports:
      - "5432:5432"
    networks:
      - cashflow-net
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow -d cashflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    profiles: ["app"]
  rabbitmq:
    image: rabbitmq@sha256:d7af1c87c5f1eda13fcfca06db452bf3aeab6619fc3358b68535c0c02c4e52bc
    environment:
      RABBITMQ_DEFAULT_USER: cashflow
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-secret}
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    networks:
      - cashflow-net
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    profiles: ["app"]
  keycloak:
    build:
      context: .
      dockerfile: deploy/identity/keycloak.Containerfile
    image: cashflow-keycloak:${CASHFLOW_VERSION:-dev}
    command: start --optimized --import-realm --http-enabled=false --https-port=8443 --https-certificate-file=/etc/cashflow/keycloak.crt --https-certificate-key-file=/etc/cashflow/keycloak.key --hostname-strict=false
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: cashflow
      KC_DB_USERNAME: cashflow
      KC_DB_PASSWORD: ${CASHFLOW_DB_PASSWORD:-secret}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: edge.cashflow.local
      CASHFLOW_CONSOLIDATION_CLIENT_SECRET: ${CASHFLOW_CONSOLIDATION_CLIENT_SECRET:-consolidation-secret-123}
      CASHFLOW_RECONCILIATION_CLIENT_SECRET: ${CASHFLOW_RECONCILIATION_CLIENT_SECRET:-reconciliation-secret-123}
      CASHFLOW_MERCHANT_A_PASSWORD: ${CASHFLOW_MERCHANT_A_PASSWORD:-merchant-a-pass}
      CASHFLOW_MERCHANT_B_PASSWORD: ${CASHFLOW_MERCHANT_B_PASSWORD:-merchant-b-pass}
    ports:
      - "8443:8443"
    networks:
      - cashflow-net
    volumes:
      - ./deploy/identity/keycloak/realm-cashflow.json:/opt/keycloak/data/import/realm.json:ro
      - ./secrets/certs:/etc/cashflow:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    profiles: ["app"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:89107a3a8f4636a396927edf7025bb9614b8da2d92f4cc3f43109e8d115736e2
    command: ["--config=/etc/otelcol/config.yaml"]
    networks:
      - cashflow-net
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped
    profiles: ["app"]
  prometheus:
    image: prom/prometheus@sha256:5888c188cf09e3f7eebc97369c3b2ce713e844cdbd88ccf36f5047c958aea120
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - cashflow-net
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    profiles: ["observability"]
  jaeger:
    image: jaegertracing/all-in-one@sha256:9864182b4e01350fcc64631bdba5f4085f87daae9d477a04c25d9cb362e787a9
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - cashflow-net
    ports:
      - "16686:16686"
      - "4317:4317"
    restart: unless-stopped
    profiles: ["observability"]
  grafana:
    image: grafana/grafana@sha256:8b37a2f028f164ce7b9889e1765b9d6ee23fec80f871d156fbf436d6198d32b7
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - cashflow-net
    volumes:
      - ./deploy/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped
    profiles: ["observability"]
  ledger-migrate:
    build:
      context: .
      dockerfile: deploy/identity/migrate.Containerfile
    image: cashflow-migrate:${CASHFLOW_VERSION:-dev}
    command: ["/usr/local/bin/ledger-migrate"]
    environment:
      CASHFLOW_DB_URL: postgres://cashflow:${CASHFLOW_DB_PASSWORD:-secret}@postgres:5432/cashflow?sslmode=disable
    networks:
      - cashflow-net
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]
  consolidation-migrate:
    build:
      context: .
      dockerfile: deploy/identity/migrate.Containerfile
    image: cashflow-migrate:${CASHFLOW_VERSION:-dev}
    command: ["/usr/local/bin/consolidation-migrate"]
    environment:
      CONSOLIDATION_DATABASE_URL: postgres://cashflow:${CASHFLOW_DB_PASSWORD:-secret}@postgres:5432/cashflow?sslmode=disable
    networks:
      - cashflow-net
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]
  ledger-api:
    build:
      context: .
      dockerfile: deploy/identity/ledger-api.Containerfile
    image: cashflow-ledger-api:${CASHFLOW_VERSION:-dev}
    environment:
      CASHFLOW_DB_URL: postgres://ledger_app:ledger_secret@postgres:5432/cashflow?sslmode=disable
      CASHFLOW_OIDC_ISSUER: https://edge.cashflow.local/realms/cashflow
      CASHFLOW_OIDC_JWKS_URL: https://keycloak:8443/realms/cashflow/protocol/openid-connect/certs
      CASHFLOW_OIDC_CA_FILE: /etc/cashflow/ca.pem
      CASHFLOW_GRPC_TLS_CERT_FILE: /etc/cashflow/ledger-api.crt
      CASHFLOW_GRPC_TLS_KEY_FILE: /etc/cashflow/ledger-api.key
      CASHFLOW_GRPC_CLIENT_CA_FILE: /etc/cashflow/ca.pem
      # Delegates both demo merchants (realm-cashflow.json) to both services.
      CASHFLOW_SERVICE_TENANT_DELEGATIONS: "cashflow-consolidation-svc=11111111-1111-4111-8111-111111111111,22222222-2222-4222-8222-222222222222;cashflow-reconciliation-svc=11111111-1111-4111-8111-111111111111,22222222-2222-4222-8222-222222222222"
      CASHFLOW_CURSOR_SECRET: "0123456789abcdef0123456789abcdef"
      CASHFLOW_OTLP_ENDPOINT: otel-collector:4317
    networks:
      - cashflow-net
    volumes:
      - ./secrets/certs:/etc/cashflow:ro
    depends_on:
      ledger-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["app"]
  consolidation-api:
    build:
      context: .
      dockerfile: deploy/identity/consolidation-api.Containerfile
    image: cashflow-consolidation-api:${CASHFLOW_VERSION:-dev}
    environment:
      CASHFLOW_DB_URL: postgres://consolidation_app:consolidation_secret@postgres:5432/cashflow?sslmode=disable
      CASHFLOW_OIDC_ISSUER: https://edge.cashflow.local/realms/cashflow
      CASHFLOW_OIDC_JWKS_URL: https://keycloak:8443/realms/cashflow/protocol/openid-connect/certs
      CASHFLOW_OIDC_TOKEN_URL: https://keycloak:8443/realms/cashflow/protocol/openid-connect/token
      CASHFLOW_OIDC_CA_FILE: /etc/cashflow/ca.pem
      CASHFLOW_SERVICE_CLIENT_SECRET_FILE: /run/secrets/consolidation-client-secret
      CASHFLOW_LEDGER_GRPC_TARGET: ledger-api:9081
      CASHFLOW_GRPC_TLS_CERT_FILE: /etc/cashflow/consolidation.crt
      CASHFLOW_GRPC_TLS_KEY_FILE: /etc/cashflow/consolidation.key
      CASHFLOW_GRPC_CA_FILE: /etc/cashflow/ca.pem
      CASHFLOW_GRPC_SERVER_NAME: ledger-api
      CASHFLOW_OTLP_ENDPOINT: otel-collector:4317
    networks:
      - cashflow-net
    volumes:
      - ./secrets/certs:/etc/cashflow:ro
      - ./secrets/consolidation-client-secret:/run/secrets/consolidation-client-secret:ro
    depends_on:
      consolidation-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      ledger-api:
        condition: service_started
    restart: unless-stopped
    profiles: ["app"]
  # One-shot: bootstraps the RabbitMQ v2 topology before ledger-outbox-publisher.
  ledger-outbox-topology:
    build:
      context: .
      dockerfile: deploy/identity/outbox-publisher.Containerfile
    image: cashflow-outbox-publisher:${CASHFLOW_VERSION:-dev}
    command: ["/usr/local/bin/outbox-topology", "upgrade"]
    environment:
      OUTBOX_RABBITMQ_URL: amqp://cashflow:${RABBITMQ_PASSWORD:-secret}@rabbitmq:5672/
      OUTBOX_RABBITMQ_ALLOW_INSECURE: "true"
    networks:
      - cashflow-net
    depends_on:
      rabbitmq:
        condition: service_healthy
    # RabbitMQ's healthcheck can report healthy slightly before the AMQP
    # listener itself accepts connections; retry instead of failing closed.
    restart: on-failure
    profiles: ["app"]
  ledger-outbox-publisher:
    build:
      context: .
      dockerfile: deploy/identity/outbox-publisher.Containerfile
    image: cashflow-outbox-publisher:${CASHFLOW_VERSION:-dev}
    command: ["/usr/local/bin/outbox-publisher"]
    environment:
      OUTBOX_POSTGRES_DSN: postgres://ledger_app:ledger_secret@postgres:5432/cashflow?sslmode=disable
      OUTBOX_RABBITMQ_URL: amqp://cashflow:${RABBITMQ_PASSWORD:-secret}@rabbitmq:5672/
      OUTBOX_RABBITMQ_ALLOW_INSECURE: "true"
    networks:
      - cashflow-net
    depends_on:
      ledger-migrate:
        condition: service_completed_successfully
      ledger-outbox-topology:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["app"]
  consolidation-consumer:
    build:
      context: .
      dockerfile: deploy/identity/consolidation-consumer.Containerfile
    image: cashflow-consolidation-consumer:${CASHFLOW_VERSION:-dev}
    environment:
      CONSOLIDATION_DATABASE_URL: postgres://consolidation_app:consolidation_secret@postgres:5432/cashflow?sslmode=disable
      CONSUMER_RABBITMQ_URL: amqp://cashflow:${RABBITMQ_PASSWORD:-secret}@rabbitmq:5672/
      CONSUMER_RABBITMQ_ALLOW_INSECURE: "true"
    networks:
      - cashflow-net
    depends_on:
      consolidation-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["app"]
  reconciliation-worker:
    build:
      context: .
      dockerfile: deploy/identity/reconciliation-worker.Containerfile
    image: cashflow-reconciliation-worker:${CASHFLOW_VERSION:-dev}
    environment:
      CASHFLOW_CONSOLIDATION_DSN: postgres://consolidation_app:consolidation_secret@postgres:5432/cashflow?sslmode=disable
      CASHFLOW_OIDC_ISSUER: https://edge.cashflow.local/realms/cashflow
      CASHFLOW_OIDC_JWKS_URL: https://keycloak:8443/realms/cashflow/protocol/openid-connect/certs
      CASHFLOW_OIDC_TOKEN_URL: https://keycloak:8443/realms/cashflow/protocol/openid-connect/token
      CASHFLOW_OIDC_CA_FILE: /etc/cashflow/ca.pem
      CASHFLOW_SERVICE_CLIENT_SECRET_FILE: /run/secrets/reconciliation-client-secret
      CASHFLOW_LEDGER_GRPC_TARGET: ledger-api:9081
      CASHFLOW_GRPC_TLS_CERT_FILE: /etc/cashflow/consolidation.crt
      CASHFLOW_GRPC_TLS_KEY_FILE: /etc/cashflow/consolidation.key
      CASHFLOW_GRPC_CA_FILE: /etc/cashflow/ca.pem
      CASHFLOW_GRPC_SERVER_NAME: ledger-api
      CASHFLOW_OTLP_ENDPOINT: otel-collector:4317
    networks:
      - cashflow-net
    volumes:
      - ./secrets/certs:/etc/cashflow:ro
      - ./secrets/reconciliation-client-secret:/run/secrets/reconciliation-client-secret:ro
    depends_on:
      consolidation-migrate:
        condition: service_completed_successfully
      ledger-api:
        condition: service_started
    restart: unless-stopped
    profiles: ["app"]
  krakend:
    build:
      context: .
      dockerfile: deploy/edge/krakend.Containerfile
    image: cashflow-krakend:${CASHFLOW_VERSION:-dev}
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    environment:
      SSL_CERT_FILE: /etc/cashflow/ca.pem
    ports:
      - "8080:8080"
    networks:
      - cashflow-net
    volumes:
      - ./secrets/certs/ca.pem:/etc/cashflow/ca.pem:ro
    depends_on:
      - ledger-api
      - consolidation-api
    restart: unless-stopped
    profiles: ["app"]
  k6:
    image: grafana/k6@sha256:b24f418fc99a26dd57904c952c03bfaf79462be18508acc45aafa07ff68e7df2
    entrypoint: ["k6", "run", "--insecure-skip-tls-verify", "--summary-export=/reports/load-test-summary.json", "/scripts/load.js"]
    environment:
      BASE_URL: http://krakend:8080
      KEYCLOAK_URL: https://keycloak:8443/realms/cashflow/protocol/openid-connect/token
    networks:
      - cashflow-net
    volumes:
      - ./test/k6:/scripts:ro
      - ./evidence/reports:/reports
    profiles: ["load-test"]
  k6-backend:
    image: grafana/k6@sha256:b24f418fc99a26dd57904c952c03bfaf79462be18508acc45aafa07ff68e7df2
    entrypoint: ["k6", "run", "--insecure-skip-tls-verify", "--summary-export=/reports/load-test-backend-summary.json", "/scripts/load-backend.js"]
    environment:
      LEDGER_URL: http://ledger-api:8081
      CONSOLIDATION_URL: http://consolidation-api:8082
      KEYCLOAK_URL: https://keycloak:8443/realms/cashflow/protocol/openid-connect/token
    networks:
      - cashflow-net
    volumes:
      - ./test/k6:/scripts:ro
      - ./evidence/reports:/reports
    profiles: ["load-test"]
networks:
  cashflow-net:
    driver: bridge
volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
