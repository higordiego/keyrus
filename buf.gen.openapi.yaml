# json_names_for_fields stays at its default (true): response bodies are
# always camelCase (protojson default). Query parameters still need
# snake_case (start_date, end_date) to actually bind; see README/Postman.
version: v2
clean: true
plugins:
  - local: protoc-gen-openapiv2
    out: api/openapi
    strategy: all
    opt:
      - allow_merge=true
      - merge_file_name=cashflow-public-v1
      - generate_unbound_methods=false
      - disable_default_responses=true
      - use_go_templates=true
