title = "Keyrus cash-flow secret detection policy"

[extend]
useDefault = true

[[rules]]
id = "devsecops-fixture-token"
description = "Controlled token pattern used only to prove the blocking gate"
regex = '''SECURITY_TEST_TOKEN_[A-Z0-9]{32}'''
keywords = ["SECURITY_TEST_TOKEN_"]

[[allowlists]]
description = "The inert negative fixture is scanned from a temporary non-allowlisted path by its test"
paths = ['''test/fixtures/security/negative-secret\.txt''']

[[allowlists]]
description = "Generated local tools and evidence are outside the versioned source boundary"
paths = ['''(^|/)\.tools/''', '''(^|/)evidence/reports/''']
