name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true
      - name: Verify foundation
        run: make ci
      - name: Build basic reports
        if: always()
        run: make reports
      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-reports
          path: evidence/reports/
          if-no-files-found: error
