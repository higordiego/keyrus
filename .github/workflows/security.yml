name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-security:
    name: source-security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - name: Scan source, history and configuration
        run: make security
      - name: Publish security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-evidence-${{ github.sha }}
          path: evidence/reports/security/
          if-no-files-found: error
          retention-days: 30

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request' && (github.event.repository.visibility == 'public' || vars.DEPENDENCY_REVIEW_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: high
          license-check: false

  sarif-upload:
    name: security-sarif-upload
    if: always() && (github.event.repository.visibility == 'public' || vars.CODE_SCANNING_ENABLED == 'true')
    needs: source-security
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download security evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: security-evidence-${{ github.sha }}
          path: evidence/reports/security/
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@47be0dbd5113ab1b79fe2dd3f68bdf7e426cdc87 # v3
        with:
          sarif_file: evidence/reports/security/trivy-filesystem.sarif
