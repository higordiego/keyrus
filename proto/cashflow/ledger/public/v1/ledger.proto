syntax = "proto3";

package cashflow.ledger.public.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/higordiegoti/keyrus/gen/go/cashflow/ledger/public/v1;ledgerv1";

// LedgerService exposes the public contract consumed through the edge HTTP adapter.
service LedgerService {
  rpc CreateEntry(CreateEntryRequest) returns (CreateEntryResponse) {
    option (google.api.http) = {
      post: "/v1/entries"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create a confirmed ledger entry"
      description: "Creates a durable credit or debit. The Idempotency-Key is scoped to the authenticated merchant."
      parameters: {
        headers: {
          name: "Idempotency-Key"
          description: "Required idempotency key for this command."
          type: STRING
          required: true
        }
      }
      responses: {
        key: "201"
        value: {
          description: "Entry confirmed durably."
          schema: {
            json_schema: {ref: ".cashflow.ledger.public.v1.CreateEntryResponse"}
          }
        }
      }
      responses: {
        key: "400"
        value: {description: "Invalid financial value, type, currency, business date, or request."}
      }
      responses: {
        key: "401"
        value: {description: "Missing or invalid authentication."}
      }
      responses: {
        key: "403"
        value: {description: "Authenticated identity lacks the required scope."}
      }
      responses: {
        key: "409"
        value: {description: "Idempotency key was already used with different content."}
      }
    };
  }

  rpc GetEntry(GetEntryRequest) returns (GetEntryResponse) {
    option (google.api.http) = {get: "/v1/entries/{entry_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {
          description: "Entry owned by the authenticated merchant."
          schema: {
            json_schema: {ref: ".cashflow.ledger.public.v1.GetEntryResponse"}
          }
        }
      }
      responses: {
        key: "401"
        value: {description: "Missing or invalid authentication."}
      }
      responses: {
        key: "403"
        value: {description: "Authenticated identity lacks the required scope."}
      }
      responses: {
        key: "404"
        value: {description: "Entry absent or not owned by the authenticated merchant; the response does not reveal which."}
      }
    };
  }

  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse) {
    option (google.api.http) = {get: "/v1/entries"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {
          description: "Page of entries owned by the authenticated merchant."
          schema: {
            json_schema: {ref: ".cashflow.ledger.public.v1.ListEntriesResponse"}
          }
        }
      }
      responses: {
        key: "400"
        value: {description: "Invalid period, page size, or cursor."}
      }
      responses: {
        key: "401"
        value: {description: "Missing or invalid authentication."}
      }
      responses: {
        key: "403"
        value: {description: "Authenticated identity lacks the required scope."}
      }
    };
  }

  rpc CreateReversal(CreateReversalRequest) returns (CreateReversalResponse) {
    option (google.api.http) = {post: "/v1/entries/{entry_id}/reversals"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create an integral reversal"
      description: "Creates one confirmed compensating entry. Reads project the original as reversed without updating its stored record or values."
      parameters: {
        headers: {
          name: "Idempotency-Key"
          description: "Required idempotency key for this reversal command."
          type: STRING
          required: true
        }
      }
      responses: {
        key: "201"
        value: {
          description: "Compensating entry confirmed durably."
          schema: {
            json_schema: {ref: ".cashflow.ledger.public.v1.CreateReversalResponse"}
          }
        }
      }
      responses: {
        key: "400"
        value: {description: "Reversal request is invalid or not permitted."}
      }
      responses: {
        key: "401"
        value: {description: "Missing or invalid authentication."}
      }
      responses: {
        key: "403"
        value: {description: "Authenticated identity lacks the required scope."}
      }
      responses: {
        key: "404"
        value: {description: "Original entry absent or not owned by the authenticated merchant; the response does not reveal which."}
      }
      responses: {
        key: "409"
        value: {description: "Idempotency conflict or the original entry was already reversed."}
      }
    };
  }
}

enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  ENTRY_TYPE_CREDIT = 1;
  ENTRY_TYPE_DEBIT = 2;
}

enum EntryState {
  ENTRY_STATE_UNSPECIFIED = 0;
  // The entry is durably confirmed and has no confirmed compensation.
  ENTRY_STATE_CONFIRMED = 1;
  // Read projection for an original entry that has a confirmed compensation.
  ENTRY_STATE_REVERSED = 2;
}

message LedgerEntry {
  string entry_id = 1;
  EntryType type = 2;
  // Decimal BRL value with exactly two fractional digits, for example "100.00".
  string amount = 3;
  string currency = 4;
  // Calendar date (YYYY-MM-DD) fixed when the entry is confirmed.
  string business_date = 5;
  string description = 6;
  google.protobuf.Timestamp confirmed_at = 7;
  uint64 merchant_position = 8;
  // Set on a compensating entry; the compensation itself is a new CONFIRMED entry.
  string original_entry_id = 9;
  // Read projection on an original entry when its compensation exists. This is
  // derived from the compensating entry and is not persisted by updating the original.
  string reversal_entry_id = 10;
  // Read projection derived from confirmation and any compensating entry. REVERSED
  // never means that the stored original record or its financial values were updated.
  EntryState state = 11;
}

message CreateEntryRequest {
  EntryType type = 1;
  string amount = 2;
  string currency = 3;
  string business_date = 4;
  string description = 5;
}

message CreateEntryResponse {
  LedgerEntry entry = 1;
}

message GetEntryRequest {
  string entry_id = 1;
}

message GetEntryResponse {
  LedgerEntry entry = 1;
}

message ListEntriesRequest {
  string start_date = 1;
  string end_date = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListEntriesResponse {
  repeated LedgerEntry entries = 1;
  string next_page_token = 2;
}

message CreateReversalRequest {
  string entry_id = 1;
}

message CreateReversalResponse {
  LedgerEntry reversal = 1;
}
